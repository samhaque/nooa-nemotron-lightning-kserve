[project]
name = "nooa-nemotron-lightning-kserve"
version = "0.1.0"
description = "NOOA sample agent wired to a self-hosted Nemotron Lightning 30B A3B NIM behind OpenShift KServe/Kourier"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa>=0.1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_agent"]
